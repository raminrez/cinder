[install]
linker = "isolated"

[serve.static]
env = "disable"

[test]
timeout = 10000

[fmt]
semi = true
singleQuote = false
trailingComma = "all"
printWidth = 100
ignorePatterns = [
  "node_modules",
  "dist",
  "**/dist",
  ".research",
  ".tools",
  ".taste-skill",
  "bun.lock",
  "packages/tokens/src/tokens.css",
  "packages/tokens/src/tokens.json",
  "test-results",
]
